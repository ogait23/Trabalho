{% extends "admin/base_admin.html" %}

{% block titulo %}Produto — Administração{% endblock %}

{% block admin_conteudo %}
<h1>{{ "Editar produto" if produto else "Novo produto" }}</h1>

<form method="post">
    <label for="nome">Nome</label>
    <input type="text" name="nome" id="nome" value="{{ produto.nome if produto else '' }}" required>

    <label for="descricao">Descrição</label>
    <textarea name="descricao" id="descricao">{{ produto.descricao if produto else '' }}</textarea>

    <label for="categoria_id">Categoria</label>
    <select name="categoria_id" id="categoria_id" required>
        {% for categoria in categorias %}
        <option value="{{ categoria.id }}" {% if produto and produto.categoria_id == categoria.id %}selected{% endif %}>
            {{ categoria.nome }}
        </option>
        {% endfor %}
    </select>

    <label for="preco">Preço</label>
    <input type="number" step="0.01" name="preco" id="preco" value="{{ produto.preco if produto else '' }}" required>

    <label for="disponivel">
        <input type="checkbox" name="disponivel" id="disponivel" {% if not produto or produto.disponivel %}checked{% endif %}>
        Disponível no cardápio
    </label>

    <button type="submit">Salvar</button>
</form>
{% endblock %}
