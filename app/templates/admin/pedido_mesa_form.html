{% extends "admin/base_admin.html" %}

{% block titulo %}Novo pedido de mesa{% endblock %}

{% block admin_conteudo %}
<h1>Abrir pedido de mesa</h1>

<form method="post" action="{{ url_for('admin.novo_pedido_mesa') }}">
    <label for="mesa_id">Mesa</label>
    <select name="mesa_id" id="mesa_id" required>
        {% for mesa in mesas %}
        <option value="{{ mesa.id }}">Mesa {{ mesa.numero }} ({{ mesa.status|rotulo_mesa }})</option>
        {% endfor %}
    </select>

    <label for="garcom_id">Garçom responsável</label>
    <select name="garcom_id" id="garcom_id" required>
        {% for garcom in garcons %}
        <option value="{{ garcom.id }}">{{ garcom.nome }}</option>
        {% endfor %}
    </select>

    <button type="submit">Abrir pedido</button>
</form>
{% endblock %}
