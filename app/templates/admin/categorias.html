{% extends "admin/base_admin.html" %}

{% block titulo %}Categorias — Administração{% endblock %}

{% block admin_conteudo %}
<h1>Categorias</h1>
<a class="botao" href="{{ url_for('admin.nova_categoria') }}">Nova categoria</a>

<table class="tabela">
    <thead><tr><th>Nome</th><th>Tipo</th><th></th></tr></thead>
    <tbody>
        {% for categoria in categorias %}
        <tr>
            <td>{{ categoria.nome }}</td>
            <td>{{ categoria.tipo|rotulo_categoria }}</td>
            <td>
                <a href="{{ url_for('admin.editar_categoria', categoria_id=categoria.id) }}">Editar</a>
                <form method="post" action="{{ url_for('admin.excluir_categoria', categoria_id=categoria.id) }}" class="form-linha">
                    <button type="submit">Excluir</button>
                </form>
            </td>
        </tr>
        {% endfor %}
    </tbody>
</table>
{% endblock %}
