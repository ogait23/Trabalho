{% extends "admin/base_admin.html" %}

{% block titulo %}Categoria — Administração{% endblock %}

{% block admin_conteudo %}
<h1>{{ "Editar categoria" if categoria else "Nova categoria" }}</h1>

<form method="post">
    <label for="nome">Nome</label>
    <input type="text" name="nome" id="nome" value="{{ categoria.nome if categoria else '' }}" required>

    <label for="tipo">Tipo</label>
    <select name="tipo" id="tipo" required>
        {% for valor, rotulo in tipos %}
        <option value="{{ valor }}" {% if categoria and categoria.tipo == valor %}selected{% endif %}>{{ rotulo }}</option>
        {% endfor %}
    </select>

    <button type="submit">Salvar</button>
</form>
{% endblock %}
